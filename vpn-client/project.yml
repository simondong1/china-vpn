name: VPN
options:
  bundleIdPrefix: com.vpn
  deploymentTarget:
    macOS: "12.0"
  developmentLanguage: en
  xcodeVersion: "14.0"
  usesTabs: false
  indentWidth: 2
  tabWidth: 2
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: "5.9"
targets:
  VPN:
    type: application
    platform: macOS
    sources:
      - path: VPN
      - path: VPNExtension/VPNConfig.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vpn.client
      INFOPLIST_FILE: VPN/Info.plist
      CODE_SIGN_ENTITLEMENTS: VPN/VPN.entitlements
      CODE_SIGN_STYLE: Manual
    dependencies:
      - target: VPNExtension
        embed: true
    scheme:
      testTargets: []
  VPNExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: VPNExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vpn.client.extension
      INFOPLIST_FILE: VPNExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: VPNExtension/VPNExtension.entitlements
      CODE_SIGN_STYLE: Manual
