name: VPN
options:
  bundleIdPrefix: com.vpn
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  VPN:
    type: application
    platform: macOS
    sources:
      - VPNApp.swift
      - VPNManager.swift
      - SettingsView.swift
    settings:
      PRODUCT_NAME: VPN
      PRODUCT_BUNDLE_IDENTIFIER: com.vpn.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: "5.9"
      INFOPLIST_KEY_LSUIElement: true
      INFOPLIST_KEY_NSAppleEventsUsageDescription: "VPN needs to modify network settings"
