name: Build DongVPN

on:
  push:
    branches: [main, master]
    paths:
      - 'XrayVPN/**'
      - '.github/workflows/build-dongvpn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Build app
      working-directory: XrayVPN
      env:
        DONGVPN_VLESS_LINK: ${{ secrets.DONGVPN_VLESS_LINK }}
        DONGVPN_HK_VLESS_LINK: ${{ secrets.DONGVPN_HK_VLESS_LINK }}
        DONGVPN_CONTROL_URL: ${{ secrets.DONGVPN_CONTROL_URL }}
        DONGVPN_CONTROL_TOKEN: ${{ secrets.DONGVPN_CONTROL_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p build
        xcodebuild -project XrayVPN.xcodeproj -scheme XrayVPN -configuration Release -archivePath build/DongVPN.xcarchive archive CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log

        mkdir -p build/DongVPN
        cp -R build/DongVPN.xcarchive/Products/Applications/DongVPN.app build/DongVPN/
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" build/DongVPN/DongVPN.app/Contents/Info.plist
        fi

        XRAY_VERSION=v26.10.21
        mkdir -p build/xray-arm64 build/xray-x86_64 build/DongVPN/DongVPN.app/Contents/Resources
        curl --fail --location "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-arm64-v8a.zip" --output build/xray-arm64.zip
        curl --fail --location "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-64.zip" --output build/xray-x86_64.zip
        unzip -oq build/xray-arm64.zip -d build/xray-arm64
        unzip -oq build/xray-x86_64.zip -d build/xray-x86_64
        install -m 755 build/xray-arm64/xray build/DongVPN/DongVPN.app/Contents/Resources/xray-arm64
        install -m 755 build/xray-x86_64/xray build/DongVPN/DongVPN.app/Contents/Resources/xray-x86_64
        cp build/xray-arm64/LICENSE build/DongVPN/DongVPN.app/Contents/Resources/Xray-LICENSE
        cp build/xray-arm64/geoip.dat build/xray-arm64/geosite.dat build/DongVPN/DongVPN.app/Contents/Resources/
        test -x build/DongVPN/DongVPN.app/Contents/Resources/xray-arm64
        test -x build/DongVPN/DongVPN.app/Contents/Resources/xray-x86_64
        test -s build/DongVPN/DongVPN.app/Contents/Resources/geoip.dat
        test -s build/DongVPN/DongVPN.app/Contents/Resources/geosite.dat

        if [ -n "${DONGVPN_VLESS_LINK:-}" ]; then
          case "$DONGVPN_VLESS_LINK" in
            vless://*) ;;
            *) echo "::error::DONGVPN_VLESS_LINK must be a vless:// link"; exit 1 ;;
          esac
          printf '%s\n' "$DONGVPN_VLESS_LINK" > build/DongVPN/DongVPN.app/Contents/Resources/default.vless
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "::error::Set the DONGVPN_VLESS_LINK repository secret before tagging a build."
          exit 1
        else
          echo "::warning::DONGVPN_VLESS_LINK is not set; this build asks for a vless:// link on first launch."
        fi

        if [ -n "${DONGVPN_HK_VLESS_LINK:-}" ]; then
          case "$DONGVPN_HK_VLESS_LINK" in
            vless://*) ;;
            *) echo "::error::DONGVPN_HK_VLESS_LINK must be a vless:// link"; exit 1 ;;
          esac
          if [ -z "${DONGVPN_CONTROL_URL:-}" ] || [ -z "${DONGVPN_CONTROL_TOKEN:-}" ]; then
            echo "::error::Hong Kong builds require DONGVPN_CONTROL_URL and DONGVPN_CONTROL_TOKEN."
            exit 1
          fi
          case "$DONGVPN_CONTROL_URL" in
            https://*) ;;
            *) echo "::error::DONGVPN_CONTROL_URL must use HTTPS"; exit 1 ;;
          esac
          printf '%s\n' "$DONGVPN_HK_VLESS_LINK" > build/DongVPN/DongVPN.app/Contents/Resources/hong-kong.vless
          printf '{"url":"%s","token":"%s","leaseSeconds":180}\n' \
            "$DONGVPN_CONTROL_URL" "$DONGVPN_CONTROL_TOKEN" \
            > build/DongVPN/DongVPN.app/Contents/Resources/hk-control.json
          chmod 600 build/DongVPN/DongVPN.app/Contents/Resources/hong-kong.vless build/DongVPN/DongVPN.app/Contents/Resources/hk-control.json
        elif [ -n "${DONGVPN_CONTROL_URL:-}${DONGVPN_CONTROL_TOKEN:-}" ]; then
          echo "::error::Hong Kong control secrets require DONGVPN_HK_VLESS_LINK."
          exit 1
        fi

        ln -s /Applications build/DongVPN/Applications
        test "$(find build/DongVPN -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 2
        test -d build/DongVPN/DongVPN.app
        hdiutil create -volname "DongVPN" -srcfolder build/DongVPN -ov -format UDZO DongVPN.dmg

    - name: Deploy configured DMG to the password-protected site
      if: github.ref == 'refs/heads/master'
      env:
        DONGVPN_SSH_TARGET: ${{ secrets.DONGVPN_SSH_TARGET }}
        DONGVPN_SSH_KEY: ${{ secrets.DONGVPN_SSH_KEY }}
        DONGVPN_SSH_KNOWN_HOSTS_ENTRY: ${{ secrets.DONGVPN_SSH_KNOWN_HOSTS }}
        DONGVPN_PUBLIC_URL: https://52.34.245.131:8443
        DONGVPN_DMG_PATH: ../XrayVPN/DongVPN.dmg
      run: |
        set -euo pipefail
        test -n "$DONGVPN_SSH_TARGET"
        test -n "$DONGVPN_SSH_KEY"
        test -n "$DONGVPN_SSH_KNOWN_HOSTS_ENTRY"
        key_path=$(mktemp "$RUNNER_TEMP/dongvpn-ssh-key.XXXXXX")
        known_hosts_path=$(mktemp "$RUNNER_TEMP/dongvpn-known-hosts.XXXXXX")
        trap 'rm -f "$key_path" "$known_hosts_path"' EXIT
        printf '%s\n' "$DONGVPN_SSH_KEY" > "$key_path"
        chmod 600 "$key_path"
        printf '%s\n' "$DONGVPN_SSH_KNOWN_HOSTS_ENTRY" > "$known_hosts_path"
        DONGVPN_SSH_KEY="$key_path" \
          DONGVPN_SSH_KNOWN_HOSTS="$known_hosts_path" \
          ./website/deploy.sh

    - name: Report Xcode failure
      if: failure()
      shell: bash
      run: |
        if [ -f XrayVPN/build/xcodebuild.log ]; then
          summary=$(grep -iE 'error:|fatal|ld:|undefined|build failed|command .* failed' XrayVPN/build/xcodebuild.log | tail -n 40 | tr '\n' ' ' | cut -c 1-6000)
          if [ -n "$summary" ]; then
            echo "::error title=Xcode build output::$summary"
          else
            echo "::error title=Xcode build output::Xcode failed without a matching diagnostic line. See the job artifact."
          fi
        fi

    - name: Upload Xcode diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: DongVPN-xcode-diagnostics-${{ github.run_id }}
        path: XrayVPN/build/xcodebuild.log
        if-no-files-found: warn
