name: Build XrayVPN

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'XrayVPN/**'
      - '.github/workflows/build-xrayvpn.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Build app
      working-directory: XrayVPN
      run: |
        set -euo pipefail
        mkdir -p build
        xcodebuild -project XrayVPN.xcodeproj -scheme XrayVPN -configuration Release -archivePath build/XrayVPN.xcarchive archive CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log

        mkdir -p build/XrayVPN
        cp -R build/XrayVPN.xcarchive/Products/Applications/XrayVPN.app build/XrayVPN/

        XRAY_VERSION=v26.10.21
        mkdir -p build/xray-arm64 build/xray-x86_64 build/XrayVPN/XrayVPN.app/Contents/Resources
        curl --fail --location "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-arm64-v8a.zip" --output build/xray-arm64.zip
        curl --fail --location "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-macos-64.zip" --output build/xray-x86_64.zip
        unzip -oq build/xray-arm64.zip -d build/xray-arm64
        unzip -oq build/xray-x86_64.zip -d build/xray-x86_64
        install -m 755 build/xray-arm64/xray build/XrayVPN/XrayVPN.app/Contents/Resources/xray-arm64
        install -m 755 build/xray-x86_64/xray build/XrayVPN/XrayVPN.app/Contents/Resources/xray-x86_64
        cp build/xray-arm64/LICENSE build/XrayVPN/XrayVPN.app/Contents/Resources/Xray-LICENSE
        test -x build/XrayVPN/XrayVPN.app/Contents/Resources/xray-arm64
        test -x build/XrayVPN/XrayVPN.app/Contents/Resources/xray-x86_64

        cat > build/XrayVPN/README.txt << 'EOF'
        XrayVPN for macOS

        Installation:
        1. Drag XrayVPN.app to your Applications folder
        2. First launch: Control-click the app and choose Open
        3. The XrayVPN icon appears in your menu bar
        4. Click the icon, then choose Settings
        5. Paste your vless:// link from out/vpn-link.txt
        6. Click Save
        7. Click the icon and choose Connect

        This client uses the macOS SOCKS proxy for apps that honor system proxy settings.
        It is not a Network Extension packet tunnel, so some apps and UDP traffic may bypass it.

        Click Disconnect in the menu to stop.
        EOF

        hdiutil create -volname "XrayVPN" -srcfolder build/XrayVPN -ov -format UDZO XrayVPN.dmg

    - name: Report Xcode failure
      if: failure()
      shell: bash
      run: |
        if [ -f XrayVPN/build/xcodebuild.log ]; then
          summary=$(grep -E 'error:|BUILD FAILED|scheme|project' XrayVPN/build/xcodebuild.log | tail -n 30 | tr '\n' ' ' | cut -c 1-6000)
          if [ -n "$summary" ]; then
            echo "::error title=Xcode build output::$summary"
          else
            echo "::error title=Xcode build output::Xcode failed without a matching diagnostic line. See the job artifact."
          fi
        fi

    - name: Upload Xcode diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XrayVPN-xcode-diagnostics-${{ github.run_id }}
        path: XrayVPN/build
        if-no-files-found: warn

    - name: Get short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: XrayVPN-macOS-${{ steps.vars.outputs.sha_short }}
        path: XrayVPN/XrayVPN.dmg

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: XrayVPN/XrayVPN.dmg
        body: |
          XrayVPN - macOS VPN Menu Bar App

          **Installation:**
          1. Download XrayVPN.dmg
          2. Open and drag XrayVPN.app to Applications
          3. Control-click the app and choose Open the first time
          4. Click the menu bar icon, then Settings, and paste your vless:// link
          5. Choose Connect and approve the macOS administrator prompt

          **Features:**
          - Menu bar status and one-click controls
          - One-click Connect/Disconnect
          - macOS SOCKS proxy for applications that honor system proxy settings
          - Restores previous SOCKS proxy settings when disconnected
          - Easy setup: paste your vless:// link

          This uses the macOS system SOCKS proxy and is not a Network Extension packet tunnel. Apps that ignore the system proxy and UDP traffic may bypass it.

          Your server is at 52.34.245.131. Get your vless:// link from out/vpn-link.txt
