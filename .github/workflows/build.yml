name: Build macOS VPN

on:
  push:
    branches: [main, master]
    paths:
      - 'vpn-client/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        brew install xcodegen create-dmg

    - name: Build
      working-directory: vpn-client
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_CERT_NAME: ${{ secrets.APPLE_CERT_NAME }}
      run: python3 build.py

    - name: Get short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: VPN-macOS-${{ steps.vars.outputs.sha_short }}
        path: vpn-client/VPN.dmg

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: vpn-client/VPN.dmg
        body: |
          macOS VPN Client - Unsigned Build

          **Installation:**
          1. Download VPN.dmg
          2. Open and drag to Applications
          3. Disable SIP: boot Recovery Mode → Terminal → `csrutil disable`
          4. Right-click app → Open

          **Signed build:** Add `APPLE_TEAM_ID` and `APPLE_CERT_NAME` secrets to enable signing.
